[project]
name = "court-booking"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "bcrypt<4.1",
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.14.0",
    "python-jose[cryptography]>=3.5.0",
    "redis[hiredis]>=7.4.0",
    "sqlmodel>=0.0.38",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
# ============ Ruff ============
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]  # auto-generated, đừng đụng

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",  # line too long — formatter lo, không cần lint
    "B008",  # function call in default arg — FastAPI Depends() pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]  # cho phép test function naming linh hoạt

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============ Pytest ============
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",       # markers phải declare trước, tránh typo
    "--tb=short",             # traceback ngắn
]
markers = [
    "integration: integration tests (require DB)",
    "concurrency: concurrency tests (slow)",
]

# ============ Coverage ============
[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "*/alembic/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
